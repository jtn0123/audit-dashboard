sonar.projectKey=jtn0123_audit-dashboard
sonar.organization=jtn0123ismysonar

sonar.sources=.
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,coverage/**
sonar.test.inclusions=tests/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Browser code runs in the page, not under `node --test`, so it can never appear
# in the lcov report. Excluding it keeps the coverage metric honest instead of
# diluting it with files no Node test could ever reach. mcp/ is tested by
# spawning the real server as a child process (tests/mcp.test.js) — coverage
# instrumentation cannot observe a child process, so lcov reads it as 0%.
sonar.coverage.exclusions=public/**,scripts/**,eslint.config.js,mcp/**
