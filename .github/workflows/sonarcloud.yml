name: SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    # Dependabot PRs cannot read repo secrets, so SONAR_TOKEN is empty and the
    # scan always fails. Skip it rather than report a misleading red check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --ignore-scripts: no dependency here needs a lifecycle script, and CI
      # holds a SONAR_TOKEN worth protecting from one
      - run: npm ci --ignore-scripts
      # Sonar reads coverage/lcov.info; without this the quality gate sees 0%
      - run: mkdir -p coverage && npm run test:coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
