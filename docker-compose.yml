services:
  audit-dashboard:
    build:
      context: .
    # Local build pinned to the package version — never :latest
    image: audit-dashboard:2.1.0
    # This image only ever exists locally, so a `compose pull` for it resolves to
    # docker.io/library/audit-dashboard and 401s. Portainer's scheduled GitOps
    # redeploy pulls before it brings the stack up, so that 401 aborted every
    # automatic deploy — the stack sat four commits behind for four days without
    # surfacing an error anywhere the UI shows. `build` tells Compose to build
    # this service instead of pulling it.
    pull_policy: build
    container_name: audit-dashboard
    labels:
      # This image is built locally from git, so it has no registry to pull
      # from. Watchtower would otherwise retry it every 10 minutes forever and
      # log a 401 against docker.io/library/audit-dashboard each time. Updates
      # arrive through Portainer's GitOps polling of this repo instead.
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      # 127.0.0.1 by default. To reach it from other LAN devices, set
      # HOST_BIND to this box's LAN address (e.g. 192.168.1.x).
      # Never bind 0.0.0.0 on a WAN-facing interface.
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3002}:${PORT:-3002}"
    volumes:
      # Warm cache: repo data, ETags and the scan-history series survive
      # restarts, so a restart costs almost nothing against the GitHub rate
      # limit — and the Trends/History/Calendar series is not lost.
      - gh-cache:/cache
    environment:
      # Values interpolate from the shell env, a local .env file, or stack env
      # vars (Portainer). No env_file: .env is gitignored, so a git-sourced
      # deploy would fail on a missing file. Empty values fall back to the
      # app's own defaults (lib/config.js).
      - PORT=${PORT:-3002}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GH_OWNERS=${GH_OWNERS:-}
      - GH_REPOS_INCLUDE=${GH_REPOS_INCLUDE:-}
      - GH_REPOS_EXCLUDE=${GH_REPOS_EXCLUDE:-}
      - GH_INCLUDE_ARCHIVED=${GH_INCLUDE_ARCHIVED:-}
      - GH_INCLUDE_FORKS=${GH_INCLUDE_FORKS:-}
      - GH_INCLUDE_PRIVATE=${GH_INCLUDE_PRIVATE:-}
      - GH_REFRESH_MINUTES=${GH_REFRESH_MINUTES:-}
      - GH_STALE_DAYS=${GH_STALE_DAYS:-}
      - GH_CONCURRENCY=${GH_CONCURRENCY:-}
      - GH_MAX_REPOS=${GH_MAX_REPOS:-}
      - GH_AUTO_REFRESH=${GH_AUTO_REFRESH:-}
      - GH_CACHE_FILE=${GH_CACHE_FILE:-/cache/github.json}
      - GH_HISTORY_FILE=${GH_HISTORY_FILE:-/cache/history.json}
      - GH_HISTORY_DAYS=${GH_HISTORY_DAYS:-}
      - GITHUB_API_URL=${GITHUB_API_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-3002}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    mem_limit: 256m
    pids_limit: 128

volumes:
  gh-cache:
